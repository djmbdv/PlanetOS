<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="PlanetOS — Bare-Metal x86-64 OS &amp; Self-Hosted Vala Compiler">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131c33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="22%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planetGrad" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Subtle stars -->
  <g fill="#e2e8f0" opacity="0.55">
    <circle cx="88" cy="54" r="1.4"/>
    <circle cx="310" cy="44" r="1.1"/>
    <circle cx="1090" cy="62" r="1.5"/>
    <circle cx="1132" cy="148" r="1.2"/>
    <circle cx="980" cy="272" r="1.1"/>
    <circle cx="64" cy="256" r="1.3"/>
    <circle cx="430" cy="280" r="1.0"/>
  </g>

  <!-- Planet Emblem -->
  <g transform="translate(185, 160)">
    <!-- Back half of ring -->
    <ellipse cx="0" cy="0" rx="112" ry="30" transform="rotate(-20)" fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-dasharray="190 190" stroke-dashoffset="190" opacity="0.7"/>
    <!-- Planet sphere -->
    <circle cx="0" cy="0" r="64" fill="url(#planetGrad)"/>
    <!-- Inner highlight -->
    <circle cx="-18" cy="-20" r="36" fill="#ffffff" opacity="0.12"/>
    <!-- Surface band -->
    <path d="M -56 -12 Q -10 8 56 -14" fill="none" stroke="#0f172a" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round"/>
    <path d="M -60 12 Q 0 28 58 6" fill="none" stroke="#e0f2fe" stroke-opacity="0.20" stroke-width="4" stroke-linecap="round"/>
    <!-- Front half of ring -->
    <ellipse cx="0" cy="0" rx="112" ry="30" transform="rotate(-20)" fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-dasharray="185 200"/>
    <!-- Orbiting moon -->
    <circle cx="88" cy="-58" r="7" fill="#38bdf8"/>
    <circle cx="86" cy="-60" r="2.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Title & Tagline -->
  <g transform="translate(340, 108)">
    <text x="0" y="0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#titleGrad)">PlanetOS</text>
    <text x="2" y="38" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#cbd5e1">
      Bare-Metal x86-64 Operating System &amp; Self-Hosted Vala Compiler
    </text>
    <text x="2" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#94a3b8">
      Vala -&gt; x86-64 / SPIR-V (planc)  •  Zero C / Zero libc  •  Ring 3 + XFS + Compositor
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(340, 208)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="0" y="0" width="144" height="32" rx="8" fill="#0ea5e9" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="72" y="20" text-anchor="middle" fill="#7dd3fc">planc self-host</text>

    <rect x="156" y="0" width="136" height="32" rx="8" fill="#6366f1" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.45"/>
    <text x="224" y="20" text-anchor="middle" fill="#c7d2fe">x86-64 Long</text>

    <rect x="304" y="0" width="142" height="32" rx="8" fill="#8b5cf6" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="375" y="20" text-anchor="middle" fill="#ddd6fe">Cairo + GTK</text>

    <rect x="458" y="0" width="154" height="32" rx="8" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="535" y="20" text-anchor="middle" fill="#6ee7b7">SPIR-V / Venus</text>

    <rect x="624" y="0" width="154" height="32" rx="8" fill="#f59e0b" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="701" y="20" text-anchor="middle" fill="#fde68a">VirtIO-GPU PCI</text>
  </g>
</svg>
